  <ion-menu contentId="main-content" side="start">

    <ion-header>
      <ion-toolbar>
        <ion-title>Menu</ion-title>
      </ion-toolbar>
    </ion-header>

    @if(role === "super-admin"){
        <ion-content>
          <ion-list>

            <ion-item routerLink="/super-admin">
              <ion-label>Home</ion-label>
            </ion-item>

            <ion-item routerLink="/super-admin/semester">
              <ion-label>Semester</ion-label>
            </ion-item>
            
            <ion-item routerLink="/super-admin/students">
              <ion-label>Student</ion-label>
            </ion-item>

          </ion-list>
        </ion-content>
    }@else if(role === "admin"){
      
        <ion-content>
          <ion-list>

            <ion-item routerLink="/admin">
              <ion-label>Home</ion-label>
            </ion-item>

            <ion-item routerLink="/admin/semester">
              <ion-label>Semester</ion-label>
            </ion-item>

            <ion-item routerLink="/admin/my-classes">
              <ion-label>My Classes</ion-label>
            </ion-item>

          </ion-list>
        </ion-content>
    
    }
  </ion-menu>

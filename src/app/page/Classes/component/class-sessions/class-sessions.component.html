
<ion-list class="sessions-list">

  @for (session of sessions; track session.session_number) {
    <ion-card class="session-card">
      <ion-card-content>

        <div class="session-header">
          <div class="session-info">
            <div class="session-number">
              Session {{ session.session_number }}
            </div>

            <div class="session-date">
              <ion-icon name="calendar-outline"></ion-icon>
              {{ session.date }}
            </div>

            <div class="session-date">
              {{ session.schedule.day | titlecase }}
              · {{ session.schedule.start_time }}
              - {{ session.schedule.end_time }}
            </div>
          </div>

          <ion-badge
            [color]="session.status === 'met' ? 'success' : 'medium'"
          >
            {{ session.status | titlecase }}
          </ion-badge>
        </div>

        <ion-button
          expand="block"
          fill="outline"
          class="view-button"
          [routerLink]="['/admin/attendance/1']"
        >
          View Session
          <ion-icon slot="end" name="arrow-forward-outline"></ion-icon>
        </ion-button>

      </ion-card-content>
    </ion-card>
  }

</ion-list>

<!-- Floating Add Session Button -->
<ion-fab vertical="bottom" horizontal="end" slot="fixed">
  <ion-fab-button (click)="openAddSession()">
    <ion-icon name="add"></ion-icon>
  </ion-fab-button>
</ion-fab>

<!-- Add Session Modal -->
<app-add-session
  [isOpen]="isAddSessionOpen"
  [schedules]="schedules"
  (closed)="isAddSessionOpen = false"
  (saved)="handleSessionSaved($event)"
></app-add-session>

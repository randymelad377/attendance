
<ion-list class="schedule-list">

  @for (schedule of schedules; track $index; let i = $index) {
    <ion-card class="schedule-card">
      <ion-card-content>
        <div class="schedule-content">

          <!-- Day and Remove Button -->
          <div class="day-container">
            <div class="day-info">
              <h3>{{ schedule.day | titlecase }}</h3>
              <p>Class Schedule</p>
            </div>

            <ion-button
              fill="clear"
              color="danger"
              class="delete-button"
              (click)="removeSchedule(i)"
              aria-label="Remove schedule"
            >
              <ion-icon name="trash-outline" slot="icon-only"></ion-icon>
            </ion-button>
          </div>

          <!-- Time -->
          <div class="time-container">
            <div class="time">
              <ion-icon name="time-outline"></ion-icon>
              <span>{{ schedule.start_time }}</span>
            </div>

            <span class="time-separator">—</span>

            <div class="time">
              <span>{{ schedule.end_time }}</span>
            </div>
          </div>

        </div>
      </ion-card-content>
    </ion-card>
  }

</ion-list>

<!-- Floating Add Button -->
<ion-fab vertical="bottom" horizontal="end" slot="fixed">
  <ion-fab-button (click)="openAddSchedule()">
    <ion-icon name="add"></ion-icon>
  </ion-fab-button>
</ion-fab>

<!-- Add Schedule Modal -->
<app-add-schedules
  [isOpen]="isAddScheduleOpen"
  (closed)="isAddScheduleOpen = false">
</app-add-schedules>

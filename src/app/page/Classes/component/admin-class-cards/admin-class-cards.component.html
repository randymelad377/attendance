<ion-grid>
  <ion-row>
    <ion-col size="12"  size-xl="3">
      <ion-card class="class-card">

        <!-- Card Header -->
        <ion-card-header class="class-header">
          <div class="class-info">
            <div class="class-icon">
              <i class="fa-solid fa-book-open"></i>
            </div>

            <div class="subject-name">
              <ion-card-title>Section Name - Subject Name</ion-card-title>
              <p>Subject Code - First Year</p>
            </div>
          </div>

          <div class="status-badge">
            <span class="status-dot"></span>
            <span>Status</span>
          </div>
        </ion-card-header>

        <!-- Card Content -->
        <ion-card-content class="class-content">

          <div class="card-divider"></div>

          <div class="action-buttons">
            <button
            (click)="openConfirmation()"
              type="button"
              class="view-class-btn">
              Set as my class
            </button>
          </div>
        </ion-card-content>

      </ion-card>
    </ion-col>
  </ion-row>

  
    <app-confirmation-modal
      [isOpen]="isConfirmationOpen"
      (closed)="isConfirmationOpen = false">
    </app-confirmation-modal>

</ion-grid>

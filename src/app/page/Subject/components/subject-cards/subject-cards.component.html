<ion-grid>
  <ion-row>

    <ion-col size="12" size-md="3">
      <ion-card class="action-card">

        <ion-card-header class="card-icon">
          <div class="subject-name">
            <h3>Subject Name</h3>
            <p>Subject Code</p>
          </div>
          <p>Status</p>
        </ion-card-header>

        <ion-card-content class="card-content">
          <ion-card-title>
            Year Level
          </ion-card-title>

          @if(!isSubjectHaveSemester){
            <div class="action-buttons">
              <button (click)="openModal()">Edit</button>
              <button (click)="openArchive()">Delete</button>
            </div>
          }
        </ion-card-content>
      </ion-card>
    </ion-col>
  </ion-row>

  <!-- Modal -->
  <app-subject-modal
    [isOpen]="isModalOpen"
    (closed)="isModalOpen = false">
  </app-subject-modal>

  <app-confirmation-modal
    [isOpen]="isArchiveOpen"
    (closed)="isArchiveOpen = false">
  </app-confirmation-modal>
</ion-grid>

<ion-grid>
  <ion-row>

    <ion-col size="12" size-md="3">
      <ion-card class="action-card">

        <ion-card-header class="card-icon">
          <div class="subject-name">
            <h3>Section Name</h3>
          </div>
          <p>Status</p>
        </ion-card-header>

        <ion-card-content class="card-content">
          <ion-card-title>
            Year Level
          </ion-card-title>

          <div class="action-buttons">
            <button (click)="openModal()">Edit</button>
            <button (click)="openArchive()">Archive</button>
          </div>
        </ion-card-content>
      </ion-card>
    </ion-col>
  </ion-row>

  <!-- Modal -->
  <app-section-modal
    [isOpen]="isModalOpen"
    (closed)="isModalOpen = false">
  </app-section-modal>

    <app-confirmation-modal
      [isOpen]="isArchiveOpen"
      (closed)="isArchiveOpen = false">
    </app-confirmation-modal>

</ion-grid>

<ion-grid>
  <ion-row>

    @for (i of [].constructor(10); track $index) {
      <ion-col size="12" size-md="3">
        <ion-card class="semester-card">

          <ion-card-content class="card-content">
            <ion-card-title>
              Semester 1 <span>Active</span>
            </ion-card-title>

            <ion-card-subtitle>
              2026-2027
            </ion-card-subtitle>
          </ion-card-content>

          <div class="action-container">
            @if(role === "super-admin"){
              <ion-button [routerLink]="['/', role, 'semester-subjects', 1]">Subjects</ion-button>
              <ion-button [routerLink]="['/', role, 'semester-sections', 1]">Sections</ion-button>
            }
            <ion-button [routerLink]="['/', role, 'semester-classes', 1]">Classes</ion-button>
          </div>

        </ion-card>
      </ion-col>
    }

  </ion-row>
</ion-grid>

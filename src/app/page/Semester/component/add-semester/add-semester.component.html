<ion-content>

  <ion-grid class="main-inner-container">

    <!-- Header -->
    <ion-row class="ion-align-items-center">

      <ion-col>
        
        <h2><span routerLink="/super-admin/semester"><i class="fa-solid fa-arrow-left"></i> &nbsp;</span>Start New Semester</h2>
        <p>Make sure you add all subjects and sections need in new semester</p>
      </ion-col>

  
      <ion-col size="auto">
        <ion-button (click)="openAdd()">
          <i class="fa-solid fa-plus"></i>
          New
        </ion-button>
      </ion-col>
      

    </ion-row>

    
    <!-- SUBJECT OR SECTION BUTTON -->
    <ion-segment
      [value]="isSubject ? 'true' : 'false'"
      (ionChange)="onIsSubjectChange($event)"
    >
      <ion-segment-button value="true">
        <ion-label>Subject</ion-label>
      </ion-segment-button>

      <ion-segment-button value="false">
        <ion-label>Section</ion-label>
      </ion-segment-button>
    </ion-segment>

    <div class="space"></div>

    <!-- YEAR LEVEL -->
    <ion-segment
      [value]="year_level"
      (ionChange)="onYearChange($event)"
    >
      <ion-segment-button value="1rst_year">
        <ion-label>1st Year</ion-label>
      </ion-segment-button>

      <ion-segment-button value="2nd_year">
        <ion-label>2nd Year</ion-label>
      </ion-segment-button>

      <ion-segment-button value="3rd_year">
        <ion-label>3rd Year</ion-label>
      </ion-segment-button>

      <ion-segment-button value="4rth_year">
        <ion-label>4rth Year</ion-label>
      </ion-segment-button>
    </ion-segment>

    <ion-button class="start-btn" (click)="openConfirmation()">Start Semester</ion-button>
</ion-grid>

     <!-- ADD SUBJECT -->
  <app-add-subject
    [isOpen]="isOpenAddSubject"
    (closed)="isOpenAddSubject = false">
  </app-add-subject>

     <!-- ADD SECTION -->
  <app-add-section
    [isOpen]="isOpenAddSection"
    (closed)="isOpenAddSection = false">
  </app-add-section>

    <app-confirmation-modal
      [isOpen]="isConfirmationOpen"
      (closed)="isConfirmationOpen = false">
    </app-confirmation-modal>
</ion-content>
